name: Checks
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install browser for web tests
        run: npx playwright install --with-deps chromium
      - name: Browser and background service integration test
        run: npm run test:ui
      - name: Package portable Node.js service
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: msync-node-${{ runner.os }}
          path: release/*-node.tar.gz
          if-no-files-found: error
