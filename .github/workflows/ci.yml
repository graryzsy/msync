name: Checks
on:
  push:
  pull_request:
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native app and run core/adapter tests
        run: swift test
      - name: Package personal Mac application
        run: bash scripts/build-app.sh
  netease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Companion/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: Companion
      - run: npm test
        working-directory: Companion
